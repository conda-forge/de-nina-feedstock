schema_version: 1

context:
  name: de-nina
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d7df4dcd82613450759bda92cd874cccc1bff11bd0dbfa9b833fcce9f90e96c0

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.nina
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: "Bundesamt für Bevölkerungsschutz: NINA API"
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/bundesAPI/nina-api

extra:
  recipe-maintainers:
    - jan-janssen
